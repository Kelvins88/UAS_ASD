apiVersion: apps/v1
kind: Deployment
metadata: {name: sensor-1, namespace: kl4}
spec:
  replicas: 1
  selector: {matchLabels: {app: sensor-1}}
  template:
    metadata: {labels: {app: sensor-1, part-of: edge-agents}}
    spec:
      containers:
        - name: agent
          image: edge-agent:1.0
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: agent-config}}]
          env:
            - {name: AGENT_ID, value: sensor-1}
            - {name: AGENT_ROLE, value: sensor}
            - {name: MQTT_USER, value: sensor-1}
            - name: MQTT_PASS
              valueFrom: {secretKeyRef: {name: mqtt-creds, key: sensor-1}}
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
          readinessProbe: {httpGet: {path: /readyz, port: 8080}, initialDelaySeconds: 8, periodSeconds: 5}
---
